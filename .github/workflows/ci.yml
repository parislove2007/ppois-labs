name: CI

on:
  push:
    branches: [ main, 'feature/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ gcovr cppcheck

      - name: Configure
        run: cmake -S lab1 -B build -DENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Check coverage
        run: gcovr --root . --filter 'lab1/src/' --fail-under-line 90 --print-summary build

      - name: Static analysis
        run: cppcheck --enable=warning,style --error-exitcode=1 --suppress=missingIncludeSystem lab1/src lab1/include

  release:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++

      - name: Build release binary
        run: |
          cmake -S lab1 -B build-release \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_EXE_LINKER_FLAGS="-static"
          cmake --build build-release --target lab1_app

      - name: Check the binary is self-contained
        run: |
          file build-release/lab1_app
          ldd build-release/lab1_app || echo "статически слинкован, внешних зависимостей нет"

      - name: Determine release name
        id: meta
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "title=Лабораторная работа 1 (${{ github.ref_name }})" >> "$GITHUB_OUTPUT"
            echo "flags=" >> "$GITHUB_OUTPUT"
          else
            echo "tag=main-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "title=Лабораторная работа 1 (сборка main #${{ github.run_number }})" >> "$GITHUB_OUTPUT"
            echo "flags=--prerelease" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
             build-release/lab1_app \
             --title "${{ steps.meta.outputs.title }}" \
             --notes "Консольное приложение: прямоугольник и множество. Статически слинкованный бинарный файл для Linux x86-64." \
             ${{ steps.meta.outputs.flags }}