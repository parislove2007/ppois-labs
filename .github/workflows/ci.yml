name: CI

on:
  push:
    branches: [ main, 'feature/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ gcovr cppcheck

      - name: Configure lab1
        run: cmake -S lab1 -B build -DENABLE_COVERAGE=ON

      - name: Build lab1
        run: cmake --build build

      - name: Run lab1 tests
        run: ctest --test-dir build --output-on-failure

      - name: Check lab1 coverage
        run: gcovr --root . --filter 'lab1/src/' --fail-under-line 90 --print-summary build

      - name: Static analysis of lab1
        run: cppcheck --enable=warning,style --error-exitcode=1 --suppress=missingIncludeSystem lab1/src lab1/include

      - name: Configure lab2
        run: cmake -S lab2 -B build2 -DENABLE_COVERAGE=ON

      - name: Build lab2
        run: cmake --build build2

      - name: Run lab2 tests
        run: ctest --test-dir build2 --output-on-failure

      - name: Check lab2 coverage
        run: gcovr --root . --filter 'lab2/src/' --fail-under-line 90 --print-summary build2

      - name: Static analysis of lab2
        run: cppcheck --enable=warning,style --error-exitcode=1 --suppress=missingIncludeSystem lab2/src lab2/include

      - name: Check lab2 model metrics
        run: python3 lab2/tools/metrics.py

      - name: Configure lab3
        run: cmake -S lab3 -B build3 -DENABLE_COVERAGE=ON

      - name: Build lab3
        run: cmake --build build3

      - name: Run lab3 tests
        run: ctest --test-dir build3 --output-on-failure

      - name: Check lab3 coverage
        run: gcovr --root . --filter 'lab3/src/' --fail-under-line 90 --print-summary build3

      - name: Static analysis of lab3
        run: cppcheck --enable=warning,style --error-exitcode=1 --suppress=missingIncludeSystem lab3/src lab3/include

      - name: Check lab3 model metrics
        run: python3 lab3/tools/metrics.py

  release:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++

      - name: Build release binaries
        run: |
          cmake -S lab1 -B build-release \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_EXE_LINKER_FLAGS="-static"
          cmake --build build-release --target lab1_app
          cmake -S lab2 -B build-release-lab2 \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_EXE_LINKER_FLAGS="-static"
          cmake --build build-release-lab2 --target lab2_app
          cmake -S lab3 -B build-release-lab3 \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_EXE_LINKER_FLAGS="-static"
          cmake --build build-release-lab3 --target lab3_app

      - name: Check the binary is self-contained
        run: |
          file build-release/lab1_app build-release-lab2/lab2_app build-release-lab3/lab3_app
          ldd build-release/lab1_app || echo "lab1_app статически слинкован"
          ldd build-release-lab2/lab2_app || echo "lab2_app статически слинкован"
          ldd build-release-lab3/lab3_app || echo "lab3_app статически слинкован"

      - name: Determine release name
        id: meta
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "title=Лабораторные работы 1–3 (${{ github.ref_name }})" >> "$GITHUB_OUTPUT"
            echo "flags=" >> "$GITHUB_OUTPUT"
          else
            echo "tag=main-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "title=Лабораторные работы 1–3 (сборка main #${{ github.run_number }})" >> "$GITHUB_OUTPUT"
            echo "flags=--prerelease" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
             build-release/lab1_app \
             build-release-lab2/lab2_app \
             build-release-lab3/lab3_app \
             --title "${{ steps.meta.outputs.title }}" \
             --notes "Консольные приложения лабораторных работ 1, 2 и 3. Статически слинкованные бинарные файлы для Linux x86-64." \
             ${{ steps.meta.outputs.flags }}