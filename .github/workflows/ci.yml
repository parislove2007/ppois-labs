name: CI

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ gcovr cppcheck

      - name: Configure
        run: cmake -S lab1 -B build -DENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Check coverage
        run: gcovr --root . --filter 'lab1/src/' --fail-under-line 90 --print-summary build

      - name: Static analysis
        run: cppcheck --enable=warning,style --error-exitcode=1 --suppress=missingIncludeSystem lab1/src lab1/include